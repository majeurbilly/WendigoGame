# Bootstrap ArgoCD — appliquer manuellement hors sync automatisé :
#   kubectl apply -f deploy/k8s/argocd-app.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wendigo-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: wendigo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/majeurbilly/WendigoGame
    path: deploy/k8s
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: wendigo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
