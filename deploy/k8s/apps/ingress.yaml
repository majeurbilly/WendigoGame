# Traefik Ingress — chemins natifs Go (pas de StripPrefix /api).
# Backend: /health /metrics /auth /lobbies /ws — Frontend: /
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wendigo-ingress
  namespace: wendigo
  labels:
    app.kubernetes.io/part-of: wendigo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: wendigo.local
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /lobbies
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
