apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: wendigo
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: wendigo
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: wendigo
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: wendigo
spec:
  # Hub WebSocket in-memory — scaling horizontal reporté (Redis pub/sub / sticky sessions)
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: wendigo
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: backend
          image: ghcr.io/majeurbilly/wendigame-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Mot de passe en clair temporaire — migrer vers Secret/SealedSecret
            - name: DATABASE_URL
              value: postgres://wendigo:74c1683725b72d02b0a7ef7146e1e0b45efae36f7cd4a8e4@postgres:5432/wendigogame?sslmode=disable
            - name: REDIS_URL
              value: redis://redis:6379
            - name: ALLOWED_ORIGINS
              value: "*"
            # Authentik sur l'hôte LAN (évite le défaut code localhost:9000)
            - name: AUTHENTIK_JWKS_URL
              value: http://192.168.0.157:9000/application/o/wendigo/jwks/
            - name: OIDC_ISSUER_URL
              value: http://192.168.0.157:9000/application/o/wendigo/
            - name: OIDC_EXPECTED_ISSUER
              value: http://192.168.0.157:9000/application/o/wendigo/
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
