services:
  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wendigo-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://wendigo:wendigo123@db:5432/wendigo_game
      - SECRET_KEY=wendigo-game-secret-key-change-in-production
      - DEBUG=false
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://frontend:3000"]
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - wendigo-network
    restart: unless-stopped

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wendigo-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/v1
      - REACT_APP_WS_URL=ws://localhost:8000/api/v1/ws
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - wendigo-network
    restart: unless-stopped

  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: wendigo-db
    environment:
      - POSTGRES_DB=wendigo_game
      - POSTGRES_USER=wendigo
      - POSTGRES_PASSWORD=wendigo123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - wendigo-network
    restart: unless-stopped

  # Redis pour les sessions et cache (optionnel)
  redis:
    image: redis:7-alpine
    container_name: wendigo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wendigo-network
    restart: unless-stopped

  # Nginx pour le reverse proxy (optionnel)
  nginx:
    image: nginx:alpine
    container_name: wendigo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - wendigo-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  wendigo-network:
    driver: bridge
