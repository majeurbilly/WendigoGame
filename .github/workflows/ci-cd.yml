name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: majeurbilly
  BACKEND_IMAGE: ghcr.io/majeurbilly/wendigame-backend
  FRONTEND_IMAGE: ghcr.io/majeurbilly/wendigame-frontend

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc -b

  build-backend:
    name: Build & push backend
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build & push frontend
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8080' }}
            VITE_AUTHENTIK_URL=${{ vars.VITE_AUTHENTIK_URL || 'http://localhost:9000/application/o/wendigo/' }}
            VITE_AUTHENTIK_CLIENT_ID=${{ vars.VITE_AUTHENTIK_CLIENT_ID || 'wendigo-dev' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to k3s
    needs: [build-backend, build-frontend]
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Démarrage conditionnel d'Authentik
        env:
          AUTHENTIK_BOOTSTRAP_PASSWORD: ${{ secrets.AUTHENTIK_BOOTSTRAP_PASSWORD }}
          AUTHENTIK_BOOTSTRAP_TOKEN: ${{ secrets.AUTHENTIK_BOOTSTRAP_TOKEN }}
          AUTHENTIK_BOOTSTRAP_EMAIL: admin@stringempty.dev
          # Runner (moumou) → hôte Docker Compose (gaston)
          AUTHENTIK_SSH_HOST: gaston@192.168.0.157
          AUTHENTIK_REMOTE_DIR: ${{ vars.AUTHENTIK_REMOTE_DIR }}
        run: |
          set -euo pipefail
          REMOTE_DIR="${AUTHENTIK_REMOTE_DIR:-/home/gaston/WendigoGame}"
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=accept-new)

          if curl -sSf http://192.168.0.157:9000/-/health/ready/ > /dev/null 2>&1; then
            echo "Authentik déjà prêt sur gaston — skip Compose distant."
            exit 0
          fi

          echo "Authentik injoignable — déploiement Compose via SSH sur ${AUTHENTIK_SSH_HOST}:${REMOTE_DIR}"
          command -v ssh >/dev/null || { echo "ssh introuvable sur le runner"; exit 1; }
          command -v scp >/dev/null || { echo "scp introuvable sur le runner"; exit 1; }

          ssh "${SSH_OPTS[@]}" "${AUTHENTIK_SSH_HOST}" "mkdir -p '${REMOTE_DIR}'"
          scp "${SSH_OPTS[@]}" docker-compose.yml "${AUTHENTIK_SSH_HOST}:${REMOTE_DIR}/docker-compose.yml"

          # .env écrit sur gaston (pas sur le runner)
          ssh "${SSH_OPTS[@]}" "${AUTHENTIK_SSH_HOST}" "cat > '${REMOTE_DIR}/.env'" <<EOF
          AUTHENTIK_BOOTSTRAP_PASSWORD=${AUTHENTIK_BOOTSTRAP_PASSWORD}
          AUTHENTIK_BOOTSTRAP_EMAIL=${AUTHENTIK_BOOTSTRAP_EMAIL}
          AUTHENTIK_BOOTSTRAP_TOKEN=${AUTHENTIK_BOOTSTRAP_TOKEN}
          EOF

          ssh "${SSH_OPTS[@]}" "${AUTHENTIK_SSH_HOST}" \
            "cd '${REMOTE_DIR}' && docker compose up -d --no-recreate"

      - name: Attendre que l'API Authentik soit prête
        run: |
          set -euo pipefail
          echo "Attente /-/health/ready/ (max 10 minutes — cold boot / migrations Postgres)..."
          timeout 600 bash -c 'until curl -sSf http://192.168.0.157:9000/-/health/ready/ > /dev/null 2>&1; do echo "En attente..."; sleep 5; done'
          echo "Authentik prêt pour Pulumi."

      - name: Déployer l'infrastructure (Pulumi)
        working-directory: ./infrastructure
        env:
          # Même secret que AUTHENTIK_BOOTSTRAP_TOKEN injecté au boot Authentik
          AUTHENTIK_TOKEN: ${{ secrets.AUTHENTIK_BOOTSTRAP_TOKEN }}
          AUTHENTIK_URL: http://192.168.0.157:9000
          # PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          pnpm install
          pulumi login --local
          pulumi stack select dev || pulumi stack init dev
          pulumi up -y

      - name: Ensure kustomize
        run: |
          set -euo pipefail
          if command -v kustomize >/dev/null 2>&1; then
            kustomize version
            exit 0
          fi
          KUSTOMIZE_VERSION=v5.4.3
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Set image tags and apply
        working-directory: deploy/k8s
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null || { echo "kubectl introuvable sur le runner self-hosted"; exit 1; }

          kustomize edit set image \
            "${BACKEND_IMAGE}=${BACKEND_IMAGE}:${GITHUB_SHA}" \
            "${FRONTEND_IMAGE}=${FRONTEND_IMAGE}:${GITHUB_SHA}"

          echo "Images patchées :"
          grep -A2 '^images:' kustomization.yaml || cat kustomization.yaml

          kubectl apply -k .
          kubectl -n wendigo rollout status deployment/backend --timeout=180s
          kubectl -n wendigo rollout status deployment/frontend --timeout=180s
