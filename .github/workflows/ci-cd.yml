name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: majeurbilly
  BACKEND_IMAGE: ghcr.io/majeurbilly/wendigame-backend
  FRONTEND_IMAGE: ghcr.io/majeurbilly/wendigame-frontend

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc -b

  build-backend:
    name: Build & push backend
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build & push frontend
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://wendigo.local' }}
            VITE_AUTHENTIK_URL=${{ vars.VITE_AUTHENTIK_URL || 'http://192.168.0.157:30900/application/o/wendigo/' }}
            VITE_AUTHENTIK_CLIENT_ID=${{ vars.VITE_AUTHENTIK_CLIENT_ID || 'wendigo-dev' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to k3s
    needs: [build-backend, build-frontend]
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Postgres/Redis (and app baseline) on k3s
        working-directory: deploy/k8s
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null || { echo "kubectl introuvable sur le runner self-hosted"; exit 1; }
          # Namespace + datastore avant Authentik Helm (Pulumi)
          kubectl apply -f base/namespace.yaml
          kubectl apply -f base/postgres.yaml
          kubectl apply -f base/redis.yaml
          kubectl -n wendigo rollout status deployment/postgres --timeout=180s
          kubectl -n wendigo rollout status deployment/redis --timeout=180s

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: infrastructure/pnpm-lock.yaml

      - name: Installer Pulumi CLI
        uses: pulumi/setup-pulumi@v2

      - name: Déployer Authentik Helm + lookup OIDC (Pulumi)
        working-directory: infrastructure
        env:
          # Lookup OIDC (provider TF) — même valeur que le token bootstrap
          AUTHENTIK_TOKEN: ${{ secrets.AUTHENTIK_BOOTSTRAP_TOKEN }}
          AUTHENTIK_URL: http://192.168.0.157:30900
          PULUMI_CONFIG_PASSPHRASE: "wendigo-local-state"
          # Secrets GitHub → Pulumi config (server-agnostic)
          AUTHENTIK_BOOTSTRAP_PASSWORD: ${{ secrets.AUTHENTIK_BOOTSTRAP_PASSWORD }}
          AUTHENTIK_SECRET_KEY: ${{ secrets.AUTHENTIK_SECRET_KEY }}
          AUTHENTIK_PG_PASS: ${{ secrets.AUTHENTIK_PG_PASS }}
          PULUMI_PG_PASSWORD: ${{ secrets.PULUMI_PG_PASSWORD }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/infrastructure"
          pnpm install
          pulumi login --local
          pulumi stack select dev || pulumi stack init dev

          # Prérequis : tous les secrets repo doivent être définis
          : "${AUTHENTIK_TOKEN:?secret AUTHENTIK_BOOTSTRAP_TOKEN manquant}"
          : "${AUTHENTIK_BOOTSTRAP_PASSWORD:?secret AUTHENTIK_BOOTSTRAP_PASSWORD manquant}"
          : "${AUTHENTIK_SECRET_KEY:?secret AUTHENTIK_SECRET_KEY manquant}"
          : "${AUTHENTIK_PG_PASS:?secret AUTHENTIK_PG_PASS manquant}"
          : "${PULUMI_PG_PASSWORD:?secret PULUMI_PG_PASSWORD manquant}"

          # Source de vérité = GitHub Secrets (idempotent à chaque deploy)
          pulumi config set --secret wendigo:authentikBootstrapToken "${AUTHENTIK_TOKEN}"
          pulumi config set --secret wendigo:authentikBootstrapPassword "${AUTHENTIK_BOOTSTRAP_PASSWORD}"
          pulumi config set --secret wendigo:authentikSecretKey "${AUTHENTIK_SECRET_KEY}"
          pulumi config set --secret wendigo:authentikPgPass "${AUTHENTIK_PG_PASS}"
          pulumi config set --secret wendigo:pgPassword "${PULUMI_PG_PASSWORD}"

          pulumi up -y

      - name: Attendre Authentik (NodePort) + blueprint JWKS
        run: |
          set -euo pipefail
          AK_URL="http://192.168.0.157:30900"
          echo "Attente ${AK_URL}/-/health/ready/ (max 10 minutes)..."
          timeout 600 bash -c "until curl -sSf ${AK_URL}/-/health/ready/ > /dev/null 2>&1; do echo En attente...; sleep 5; done"
          echo "Attente JWKS OIDC Wendigo (max 3 minutes)..."
          timeout 180 bash -c "until curl -sS ${AK_URL}/application/o/wendigo/jwks/ 2>/dev/null | grep -q '\"keys\"'; do echo Provider OIDC en attente...; sleep 5; done"
          echo "Authentik K8s + OIDC Pulumi prêts."

      - name: Ensure kustomize
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          if command -v kustomize >/dev/null 2>&1; then
            kustomize version
            exit 0
          fi
          KUSTOMIZE_VERSION=v5.4.3
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp
          mv /tmp/kustomize "$HOME/.local/bin/kustomize"
          chmod +x "$HOME/.local/bin/kustomize"
          kustomize version

      - name: Set image tags and apply
        working-directory: deploy/k8s
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null || { echo "kubectl introuvable sur le runner self-hosted"; exit 1; }

          kustomize edit set image \
            "${BACKEND_IMAGE}=${BACKEND_IMAGE}:${GITHUB_SHA}" \
            "${FRONTEND_IMAGE}=${FRONTEND_IMAGE}:${GITHUB_SHA}"

          echo "Images patchées :"
          grep -A2 '^images:' kustomization.yaml || cat kustomization.yaml

          kubectl apply -k .
          kubectl -n wendigo rollout status deployment/backend --timeout=180s
          kubectl -n wendigo rollout status deployment/frontend --timeout=180s
