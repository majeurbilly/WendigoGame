name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Lint & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.mod

      - name: Resolve Go paths
        id: go-paths
        run: echo "gopath=$(go env GOPATH)" >> "$GITHUB_OUTPUT"

      - name: Cache golangci-lint
        id: golangci-lint-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-paths.outputs.gopath }}/bin
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('backend/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-

      - name: Run golangci-lint
        run: |
          if [ "${{ steps.golangci-lint-cache.outputs.cache-hit }}" != "true" ]; then
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5
          fi
          # On l'exécute avec un timeout généreux de 10 minutes
          $(go env GOPATH)/bin/golangci-lint run ./... --timeout=10m

      - name: Build backend
        run: go build -v -o ./server-bin ./cmd/server

      - name: Run unit tests
        run: go test -v -race -cover ./...