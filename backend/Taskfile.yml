version: "3"

tasks:
  run:
    desc: Run the API server (cmd/server).
    cmds:
      - go run ./cmd/server/main.go

  test:
    desc: Run all tests (verbose, race, coverage; CGO enabled).
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -v -race -cover ./...

  up:
    desc: Start the Docker Compose stack in background.
    cmds:
      - docker-compose up -d

  down:
    desc: Stop the Docker Compose stack.
    cmds:
      - docker-compose down

  logs:
    desc: Stream logs from the Valkey container (Ctrl+C to quit).
    cmds:
      - docker-compose logs -f valkey
