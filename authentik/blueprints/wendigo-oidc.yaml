# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Wendigo OIDC — provisionné nativement par Authentik (évite le crash EOF du bridge TF).
version: 1
metadata:
  name: wendigo-oidc
  labels:
    blueprints.goauthentik.io/description: "Wendigo Game — OAuth2/OIDC public client + Application"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: wendigo-oauth2-provider
    state: present
    identifiers:
      name: wendigo-dev-provider
    attrs:
      name: wendigo-dev-provider
      client_id: wendigo-dev
      client_type: public
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-explicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, authentik Self-signed Certificate]
      issuer_mode: per_provider
      sub_mode: user_uuid
      include_claims_in_id_token: true
      access_token_validity: minutes=15
      refresh_token_validity: days=30
      redirect_uris:
        - matching_mode: strict
          url: http://192.168.0.157/
        - matching_mode: strict
          url: http://192.168.0.157/login
        - matching_mode: strict
          url: http://localhost:5173/
        - matching_mode: strict
          url: http://localhost:5173/login
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [scope_name, openid]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [scope_name, email]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [scope_name, profile]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [scope_name, offline_access]

  - model: authentik_core.application
    id: wendigo-application
    state: present
    identifiers:
      slug: wendigo
    attrs:
      name: Wendigo
      slug: wendigo
      meta_launch_url: http://192.168.0.157/
      meta_publisher: Wendigo Game
      policy_engine_mode: any
      provider: !KeyOf wendigo-oauth2-provider
