name: wendigo-authentik
description: Configuration IaC Authentik pour le jeu Wendigo (OIDC / scopes / application)
runtime:
  name: nodejs
  options:
    typescript: true
config:
  # Provider Authentik — token requis : AUTHENTIK_TOKEN dans .env ou
  #   pulumi config set --secret authentik:token "ak-..."
  authentik:url: http://localhost:9000
  # Config projet (namespace wendigo — surchargeable via pulumi config set)
  wendigo:redirectUris: http://localhost:5173/,http://localhost:5173/login
  wendigo:clientId: wendigo-dev
  # OIDC en 2 temps si EOF sur ProviderOauth2 : laisser false, puis true après 1er up réussi
  wendigo:oidcIncludePropertyMappings: false
  # Google : GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (.env) ou :
  #   pulumi config set wendigo:googleClientId <id>
  #   pulumi config set --secret wendigo:googleClientSecret <secret>
